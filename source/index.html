<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paint skicar for Mac</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="ribbon">
        <section class="ribbon-group">
          <div class="ribbon-body file-group">
            <button id="openImageBtn" class="ribbon-btn large" type="button" title="Open">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>
              <span>Open</span>
            </button>
            <button id="saveBtn" class="ribbon-btn large" type="button" title="Save">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h9l3 3v11H4V3z"/><path d="M7 3v5h6V3"/><rect x="7" y="12" width="6" height="5" rx="0.5"/></svg>
              <span>Save</span>
            </button>
            <button id="saveAsBtn" class="ribbon-btn large" type="button" title="Save as">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h9l3 3v11H4V3z"/><path d="M7 3v5h6V3"/><path d="M8 15h4"/><path d="M10 13v4"/></svg>
              <span>Save as</span>
            </button>
            <button id="aboutBtn" class="ribbon-btn small file-about-btn" type="button" title="About Paint skicar for Mac">
              <span>About</span>
            </button>
          </div>
          <div class="ribbon-label">File</div>
        </section>

        <section class="ribbon-group">
          <div class="ribbon-body clipboard-group">
            <button id="pasteBtn" class="ribbon-btn large" type="button" title="Paste">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="11" height="13" rx="1"/><path d="M7 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M8 10h4M8 13h4"/></svg>
              <span>Paste</span>
            </button>
            <div class="mini-actions">
              <button id="copyBtn" class="ribbon-btn small" type="button" title="Copy">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="11" rx="1"/><path d="M5 13H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1"/></svg>
                <span>Copy</span>
              </button>
            </div>
          </div>
          <div class="ribbon-label">Clipboard</div>
        </section>

        <section class="ribbon-group">
          <div class="ribbon-body image-group">
            <button class="ribbon-btn large" data-tool="select" type="button" title="Select">
              <span class="icon-select"></span>
              <span>Select</span>
            </button>
            <button id="resizeOpenBtn" class="ribbon-btn large" type="button" title="Resize and skew">
              <svg class="ribbon-icon" viewBox="0 -0.5 17 17" aria-hidden="true"><path fill="#D1E1F1" d="M8.994,12.967 C8.994,14.101 8.074,15.021 6.939,15.021 L3.03,15.021 C1.896,15.021 0.976,14.101 0.976,12.967 L0.976,9.057 C0.976,7.924 1.896,7.004 3.03,7.004 L6.939,7.004 C8.074,7.004 8.994,7.924 8.994,9.057 L8.994,12.967 Z"/><path fill="#4A86E8" d="M14.201,2.944 L15.372,5 C15.676,5 15.923,4.754 15.923,4.452 L15.942,0.648 C15.942,0.344 15.695,0.099 15.39,0.099 L11.625,0.082 C11.318,0.082 11.072,0.326 11.072,0.63 L13.086,1.836 L9.27,5.63 C9.115,5.782 9.039,5.982 9.039,6.181 C9.039,6.383 9.115,6.581 9.27,6.734 C9.579,7.04 10.079,7.04 10.387,6.734 L14.201,2.944 Z"/><path fill="#6B96C8" d="M15.04,7.021 L15.04,13.605 C15.04,14.4 14.397,15.046 13.604,15.046 L2.375,15.046 C1.584,15.046 0.939,14.4 0.939,13.605 L0.939,2.396 C0.939,1.602 1.584,0.956 2.375,0.956 L8.979,0.956 L8.979,0.026 L2.056,0.026 C0.927,0.026 0.007,0.947 0.007,2.079 L0.007,13.911 C0.007,15.042 0.927,15.964 2.056,15.964 L13.937,15.964 C15.068,15.964 15.988,15.042 15.988,13.911 L15.988,7.021 L15.04,7.021 Z"/></svg>
              <span>Resize</span>
            </button>
          </div>
          <div class="ribbon-label">Image</div>
        </section>

        <section class="ribbon-group">
          <div class="ribbon-body tool-grid">
            <button class="tool-btn" data-tool="brush" type="button" title="Pencil">
              <svg class="tool-icon tool-icon-pencil" viewBox="0 0 32 32" aria-hidden="true"><path fill="#FFCC00" stroke="#1a1a1a" stroke-width="0.5" stroke-linejoin="round" d="M30.133 1.552c-1.090-1.044-2.291-1.573-3.574-1.573-2.006 0-3.47 1.296-3.87 1.693-0.564 0.558-19.786 19.788-19.786 19.788-0.126 0.126-0.217 0.284-0.264 0.456-0.433 1.602-2.605 8.71-2.627 8.782-0.112 0.364-0.012 0.761 0.256 1.029 0.193 0.192 0.45 0.295 0.713 0.295 0.104 0 0.208-0.016 0.31-0.049 0.073-0.024 7.41-2.395 8.618-2.756 0.159-0.048 0.305-0.134 0.423-0.251 0.763-0.754 18.691-18.483 19.881-19.712 1.231-1.268 1.843-2.59 1.819-3.925-0.025-1.319-0.664-2.589-1.901-3.776z"/><path fill="#FFCC00" d="M22.37 4.87c0.509 0.123 1.711 0.527 2.938 1.765 1.24 1.251 1.575 2.681 1.638 3.007-3.932 3.912-12.983 12.867-16.551 16.396-0.329-0.767-0.862-1.692-1.719-2.555-1.046-1.054-2.111-1.649-2.932-1.984 3.531-3.532 12.753-12.757 16.625-16.628z"/><path fill="#F69B9B" stroke="#1a1a1a" stroke-width="0.35" stroke-linejoin="round" d="M28.763 7.824c-0.041 0.042-0.109 0.11-0.19 0.192-0.316-0.814-0.87-1.86-1.831-2.828-0.981-0.989-1.976-1.572-2.773-1.917 0.068-0.067 0.12-0.12 0.141-0.14 0.114-0.113 1.153-1.106 2.447-1.106 0.745 0 1.477 0.34 2.175 1.010 0.828 0.795 1.256 1.579 1.27 2.331 0.014 0.768-0.404 1.595-1.24 2.458z"/><path fill="#1a1a1a" d="M4.387 23.186c0.55 0.146 1.691 0.57 2.854 1.742 0.896 0.904 1.319 1.9 1.509 2.508-1.39 0.447-4.434 1.497-6.367 2.121 0.573-1.886 1.541-4.822 2.004-6.371z"/></svg>
            </button>
            <button class="tool-btn" data-tool="fill" type="button" title="Fill">
              <svg class="tool-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.00914 17.9998L2.99914 13.9898C1.65914 12.6498 1.65914 11.3198 2.99914 9.9798L9.67914 3.2998L17.0291 10.6498C17.3991 11.0198 17.3991 11.6198 17.0291 11.9898L11.0091 18.0098C9.68914 19.3298 8.34914 19.3298 7.00914 17.9998Z" stroke="#A8BFD4" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.34961 1.9502L9.68961 3.29016" stroke="#9CB4CC" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path opacity="0.55" d="M2.07031 11.9197L17.1903 11.2598" stroke="#C5D4E3" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 22H16" stroke="#8E9EAE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path opacity="0.9" d="M18.85 15C18.85 15 17 17.01 17 18.24C17 19.26 17.83 20.09 18.85 20.09C19.87 20.09 20.7 19.26 20.7 18.24C20.7 17.01 18.85 15 18.85 15Z" stroke="#E66B3B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="tool-btn tool-text" data-tool="text" type="button" title="Text">
              <img class="tool-icon tool-icon-img" src="assets/text-tool.png" alt="" />
            </button>
            <button class="tool-btn" data-tool="eraser" type="button" title="Eraser">
              <svg class="tool-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.50506 11.4096L6.03539 11.9399L5.50506 11.4096ZM3 14.9522H2.25H3ZM12.5904 18.4949L12.0601 17.9646L12.5904 18.4949ZM9.04776 21V21.75V21ZM11.4096 5.50506L10.8792 4.97473L11.4096 5.50506ZM13.241 17.8444C13.5339 18.1373 14.0088 18.1373 14.3017 17.8444C14.5946 17.5515 14.5946 17.0766 14.3017 16.7837L13.241 17.8444ZM7.21629 9.69832C6.9234 9.40543 6.44852 9.40543 6.15563 9.69832C5.86274 9.99122 5.86274 10.4661 6.15563 10.759L7.21629 9.69832ZM16.073 16.073C16.3659 15.7801 16.3659 15.3053 16.073 15.0124C15.7801 14.7195 15.3053 14.7195 15.0124 15.0124L16.073 16.073ZM18.4676 11.5559C18.1759 11.8499 18.1777 12.3248 18.4718 12.6165C18.7658 12.9083 19.2407 12.9064 19.5324 12.6124L18.4676 11.5559ZM6.03539 11.9399L11.9399 6.03539L10.8792 4.97473L4.97473 10.8792L6.03539 11.9399ZM6.03539 17.9646C5.18538 17.1146 4.60235 16.5293 4.22253 16.0315C3.85592 15.551 3.75 15.2411 3.75 14.9522H2.25C2.25 15.701 2.56159 16.3274 3.03 16.9414C3.48521 17.538 4.1547 18.2052 4.97473 19.0253L6.03539 17.9646ZM4.97473 10.8792C4.1547 11.6993 3.48521 12.3665 3.03 12.9631C2.56159 13.577 2.25 14.2035 2.25 14.9522H3.75C3.75 14.6633 3.85592 14.3535 4.22253 13.873C4.60235 13.3752 5.18538 12.7899 6.03539 11.9399L4.97473 10.8792ZM12.0601 17.9646C11.2101 18.8146 10.6248 19.3977 10.127 19.7775C9.64651 20.1441 9.33665 20.25 9.04776 20.25V21.75C9.79649 21.75 10.423 21.4384 11.0369 20.97C11.6335 20.5148 12.3008 19.8453 13.1208 19.0253L12.0601 17.9646ZM4.97473 19.0253C5.79476 19.8453 6.46201 20.5148 7.05863 20.97C7.67256 21.4384 8.29902 21.75 9.04776 21.75V20.25C8.75886 20.25 8.449 20.1441 7.9685 19.7775C7.47069 19.3977 6.88541 18.8146 6.03539 17.9646L4.97473 19.0253ZM17.9646 6.03539C18.8146 6.88541 19.3977 7.47069 19.7775 7.9685C20.1441 8.449 20.25 8.75886 20.25 9.04776H21.75C21.75 8.29902 21.4384 7.67256 20.97 7.05863C20.5148 6.46201 19.8453 5.79476 19.0253 4.97473L17.9646 6.03539ZM19.0253 4.97473C18.2052 4.1547 17.538 3.48521 16.9414 3.03C16.3274 2.56159 15.701 2.25 14.9522 2.25V3.75C15.2411 3.75 15.551 3.85592 16.0315 4.22253C16.5293 4.60235 17.1146 5.18538 17.9646 6.03539L19.0253 4.97473ZM11.9399 6.03539C12.7899 5.18538 13.3752 4.60235 13.873 4.22253C14.3535 3.85592 14.6633 3.75 14.9522 3.75V2.25C14.2035 2.25 13.577 2.56159 12.9631 3.03C12.3665 3.48521 11.6993 4.1547 10.8792 4.97473L11.9399 6.03539ZM14.3017 16.7837L7.21629 9.69832L6.15563 10.759L13.241 17.8444L14.3017 16.7837ZM15.0124 15.0124L12.0601 17.9646L13.1208 19.0253L16.073 16.073L15.0124 15.0124ZM19.5324 12.6124C20.1932 11.9464 20.7384 11.3759 21.114 10.8404C21.5023 10.2869 21.75 9.71511 21.75 9.04776H20.25C20.25 9.30755 20.1644 9.58207 19.886 9.979C19.5949 10.394 19.1401 10.8781 18.4676 11.5559L19.5324 12.6124Z" fill="#F69B9B"/><path d="M9 21H21" stroke="#E58A8A" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="tool-btn" data-tool="picker" type="button" title="Color picker">
              <svg class="tool-icon" viewBox="0 -0.5 17 17" aria-hidden="true"><path fill="#4A86E8" d="M15.308,4.434 C16.22,3.523 16.118,1.939 15.079,0.9 C14.038,-0.139 12.455,-0.242 11.545,0.67 L10.364,1.853 L14.128,5.617 L15.308,4.434 Z"/><path fill="#B0B0B0" d="M5.468,14.276 L11.615,8.128 L12.387,8.9 L13.971,7.314 L8.662,2.005 L7.077,3.589 L7.85,4.362 L1.702,10.508 L0.02,15.201 L0.774,15.955 L5.468,14.276 Z M8.916,5.428 L10.551,7.064 L4.289,13.324 L1.695,14.284 L2.654,11.688 L8.916,5.428 Z"/></svg>
            </button>
          </div>
          <div class="ribbon-label">Tools</div>
        </section>

        <section class="ribbon-group">
          <div class="ribbon-body brush-size">
            <span id="brushSizeValue" class="size-value">6px</span>
            <input id="brushSize" type="range" min="1" max="80" value="6" orient="vertical" />
          </div>
          <div class="ribbon-label">Size</div>
        </section>

        <section class="ribbon-group shapes-group">
          <div class="ribbon-body">
            <div class="shape-grid">
              <button class="shape-btn" data-tool="line" type="button" title="Line">╱</button>
              <button class="shape-btn" data-tool="curve" type="button" title="Curve">⌒</button>
              <button class="shape-btn" data-tool="ellipse" type="button" title="Oval">○</button>
              <button class="shape-btn" data-tool="rect" type="button" title="Rectangle">▭</button>
              <button class="shape-btn" data-tool="roundrect" type="button" title="Rounded rectangle">▢</button>
              <button class="shape-btn" data-tool="triangle" type="button" title="Triangle">△</button>
              <button class="shape-btn" data-tool="righttri" type="button" title="Right triangle">◿</button>
              <button class="shape-btn" data-tool="diamond" type="button" title="Diamond">◇</button>
              <button class="shape-btn" data-tool="pentagon" type="button" title="Pentagon">⬟</button>
              <button class="shape-btn" data-tool="hexagon" type="button" title="Hexagon">⬡</button>
              <button class="shape-btn" data-tool="star" type="button" title="Star">☆</button>
              <button class="shape-btn" data-tool="arrow" type="button" title="Arrow">➜</button>
            </div>
            <label class="mini-label check-row">
              <input id="fillShape" type="checkbox" /> Fill shape
            </label>
          </div>
          <div class="ribbon-label">Shapes</div>
        </section>

        <section class="ribbon-group colors-group">
          <div class="ribbon-body">
            <div class="color-wells">
              <label class="color-well primary" title="Color 1">
                <input id="colorPicker" type="color" value="#000000" />
              </label>
              <label class="color-well secondary" title="Color 2">
                <input id="secondaryColor" type="color" value="#ffffff" />
              </label>
            </div>
            <div class="swatches" id="swatches"></div>
          </div>
          <div class="ribbon-label">Colors</div>
        </section>
      </div>

      <div class="canvas-area">
        <div id="textContextBar" class="text-context-bar">
          <select id="fontFamily" class="font-family-select" title="Font">
            <option value="Calibri, sans-serif" selected>Calibri</option>
            <option value="Segoe UI, Arial, sans-serif">Segoe UI</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica</option>
            <option value="'Times New Roman', Times, serif">Times New Roman</option>
            <option value="'Courier New', Courier, monospace">Courier New</option>
            <option value="Georgia, serif">Georgia</option>
          </select>
          <input
            id="fontSize"
            class="font-size-combo"
            type="number"
            min="8"
            max="999"
            value="22"
            list="fontSizeOptions"
            title="Font size"
          />
          <datalist id="fontSizeOptions">
            <option value="8"></option>
            <option value="10"></option>
            <option value="11"></option>
            <option value="12"></option>
            <option value="14"></option>
            <option value="16"></option>
            <option value="18"></option>
            <option value="20"></option>
            <option value="22"></option>
            <option value="24"></option>
            <option value="26"></option>
            <option value="28"></option>
            <option value="36"></option>
            <option value="48"></option>
            <option value="72"></option>
          </datalist>
          <div class="text-style-group">
            <button id="fontBold" class="ctx-toggle" type="button" title="Bold"><strong>B</strong></button>
            <button id="fontItalic" class="ctx-toggle" type="button" title="Italic"><em>I</em></button>
            <button id="fontUnderline" class="ctx-toggle" type="button" title="Underline"><span class="ctx-u">U</span></button>
            <button id="fontStrikethrough" class="ctx-toggle" type="button" title="Strikethrough"><span class="ctx-s">S</span></button>
          </div>
          <div class="text-align-group">
            <button id="fontAlignLeft" class="ctx-toggle active" type="button" title="Align left">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12v1.2H2zm0 3.8h8v1.2H2zm0 3.8h12v1.2H2zm0 3.8h8v1.2H2z"/></svg>
            </button>
            <button id="fontAlignCenter" class="ctx-toggle" type="button" title="Align center">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12v1.2H2zm3 3.8h6v1.2H5zm-3 3.8h12v1.2H2zm3 3.8h6v1.2H5z"/></svg>
            </button>
            <button id="fontAlignRight" class="ctx-toggle" type="button" title="Align right">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12v1.2H2zm4 3.8h8v1.2H6zm-4 3.8h12v1.2H2zm4 3.8h8v1.2H6z"/></svg>
            </button>
          </div>
          <label class="text-bg-fill">
            <input id="fontBackgroundFill" type="checkbox" />
            Background fill
          </label>
        </div>

      <div id="workspace" class="workspace">
        <div id="workspaceStage" class="workspace-stage">
        <div id="canvasWrapper" class="canvas-wrapper">
          <div class="canvas-viewport">
            <div id="canvasShell" class="canvas-shell">
              <canvas id="paintCanvas" width="900" height="550"></canvas>
              <div id="selectionBox" class="selection-box">
                <div class="selection-handle nw" data-sel-resize="nw"></div>
                <div class="selection-handle n" data-sel-resize="n"></div>
                <div class="selection-handle ne" data-sel-resize="ne"></div>
                <div class="selection-handle e" data-sel-resize="e"></div>
                <div class="selection-handle se" data-sel-resize="se"></div>
                <div class="selection-handle s" data-sel-resize="s"></div>
                <div class="selection-handle sw" data-sel-resize="sw"></div>
                <div class="selection-handle w" data-sel-resize="w"></div>
              </div>
            </div>
          </div>
          <div class="canvas-handles">
            <div class="resize-handle canvas-resize nw" data-resize="nw"></div>
            <div class="resize-handle canvas-resize n" data-resize="n"></div>
            <div class="resize-handle canvas-resize se" data-resize="se"></div>
            <div class="resize-handle canvas-resize e" data-resize="e"></div>
            <div class="resize-handle canvas-resize s" data-resize="s"></div>
            <div class="resize-handle canvas-resize ne" data-resize="ne"></div>
            <div class="resize-handle canvas-resize w" data-resize="w"></div>
            <div class="resize-handle canvas-resize sw" data-resize="sw"></div>
          </div>
        </div>
        </div>
      </div>
      </div>

      <footer class="statusbar">
        <div class="statusbar-actions">
          <button id="undoBtn" class="icon-btn" type="button" title="Undo">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7H3v4h4V8.5"/><path d="M4 8.5A6.5 6.5 0 1 1 7.5 16H6"/></svg>
          </button>
          <button id="redoBtn" class="icon-btn" type="button" title="Redo">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7h3v4h-4V8.5"/><path d="M16 8.5A6.5 6.5 0 1 0 12.5 16h1.5"/></svg>
          </button>
          <button id="darkModeToggle" class="icon-btn" type="button" title="Dark mode">
            <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15.5 11.5A6.5 6.5 0 0 1 8.5 4.5 6.5 6.5 0 1 0 15.5 11.5z"/></svg>
          </button>
        </div>
        <span id="posInfo" class="status-item">0, 0px</span>
        <span id="sizeInfo" class="status-item">900 x 550px</span>
        <span id="toolInfo" class="status-item status-hidden"></span>
        <span id="formatInfo" class="status-item status-hidden">PNG</span>
        <span id="fileInfo" class="status-item file-chip">Untitled</span>
        <div class="zoom-controls">
          <span id="zoomInfo">100%</span>
          <input id="zoomSlider" type="range" min="10" max="800" step="5" value="100" />
          <button id="zoomOutBtn" class="zoom-btn" type="button">−</button>
          <button id="zoomInBtn" class="zoom-btn" type="button">+</button>
          <button id="zoomResetBtn" class="zoom-btn" type="button">Fit</button>
        </div>
      </footer>
    </div>
    <div id="aboutDialog" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" id="aboutDialogBackdrop"></div>
      <div class="modal-panel about-dialog" role="dialog" aria-labelledby="aboutDialogTitle">
        <img class="about-icon" src="assets/icon.png" alt="" />
        <h2 id="aboutDialogTitle">Paint skicar for Mac</h2>
        <p id="aboutVersion" class="about-version">Version 2.0.0</p>
        <footer class="about-footer">
          <button id="aboutOkBtn" class="modal-btn primary" type="button">OK</button>
        </footer>
      </div>
    </div>
    <div id="resizeDialog" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" id="resizeDialogBackdrop"></div>
      <div class="modal-panel resize-dialog" role="dialog" aria-labelledby="resizeDialogTitle">
        <header class="modal-header">
          <h2 id="resizeDialogTitle">Resize and Skew</h2>
          <button id="resizeDialogClose" class="modal-close" type="button" title="Close">×</button>
        </header>
        <div class="modal-body">
          <section class="modal-section">
            <h3>Resize</h3>
            <div class="radio-row">
              <label class="radio-label">
                <input id="resizeModePercent" type="radio" name="resizeMode" value="percent" checked />
                Percentage
              </label>
              <label class="radio-label">
                <input id="resizeModePixels" type="radio" name="resizeMode" value="pixels" />
                Pixels
              </label>
            </div>
            <div class="resize-input-row">
              <label class="resize-field">
                <span class="resize-field-label">Horizontal</span>
                <div class="resize-input-wrap">
                  <input id="widthInput" type="number" min="1" max="10000" value="100" />
                  <span id="resizeUnitH" class="resize-unit">%</span>
                </div>
              </label>
              <button id="keepRatioLink" class="ratio-link active" type="button" title="Maintain aspect ratio">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7a3 3 0 1 0-2.8 4.2"/><path d="M12 13a3 3 0 1 0 2.8-4.2"/><path d="M8 10h4"/></svg>
              </button>
              <label class="resize-field">
                <span class="resize-field-label">Vertical</span>
                <div class="resize-input-wrap">
                  <input id="heightInput" type="number" min="1" max="10000" value="100" />
                  <span id="resizeUnitV" class="resize-unit">%</span>
                </div>
              </label>
            </div>
          </section>
          <section class="modal-section">
            <h3>Skew</h3>
            <div class="resize-input-row skew-row">
              <label class="resize-field">
                <span class="resize-field-label">Horizontal</span>
                <div class="resize-input-wrap">
                  <input id="skewHorizontalInput" type="number" min="-89" max="89" value="0" />
                  <span class="resize-unit">°</span>
                </div>
              </label>
              <span class="ratio-spacer"></span>
              <label class="resize-field">
                <span class="resize-field-label">Vertical</span>
                <div class="resize-input-wrap">
                  <input id="skewVerticalInput" type="number" min="-89" max="89" value="0" />
                  <span class="resize-unit">°</span>
                </div>
              </label>
            </div>
          </section>
        </div>
        <footer class="modal-footer">
          <button id="resizeApplyBtn" class="modal-btn primary" type="button">OK</button>
          <button id="resizeCancelBtn" class="modal-btn" type="button">Cancel</button>
        </footer>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="src/state.js"></script>
    <script src="src/history.js"></script>
    <script src="src/zoom.js"></script>
    <script src="src/drawing-tools.js"></script>
    <script src="src/canvas.js"></script>
    <script src="src/file-helpers.js"></script>
    <script src="src/paste-layer.js"></script>
    <script src="src/text-layer.js"></script>
    <script src="src/files.js"></script>
    <script src="src/fill-tools.js"></script>
    <script src="src/selection.js"></script>
    <script src="src/ui-events.js"></script>
  </body>
</html>
